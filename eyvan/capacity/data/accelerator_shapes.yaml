#
# Accelerator shapes Eyvan knows the dimensions of.
#
# Before this file, shape knowledge lived in three places that could disagree:
# a compute-TPU dict, a queued-slice dict, and an autoscale policy that derived
# a chip count from the type suffix and then hardcoded `cpu: 32` for every TPU
# ever made. Operators made up the difference by hand-writing `resources:` into
# every fleet YAML.
#
# Two version levels, and they mean different things:
#   catalog_version -- the schema. A build that does not understand it refuses
#                      to load, rather than silently ignoring fields it cannot
#                      read.
#   revision        -- the contents. Bump whenever a source or resource value
#                      changes so reviews can identify the exact value set.
#
# `hosts` and `chips_per_host` are OPTIONAL and present only where this
# repository can ground them. For v5p they follow from `ct5p-hightpu-4t`, the
# machine type already encoded in `fleet_config`: four chips per host. For
# generations where nothing here establishes a host count, the fields are
# omitted rather than guessed -- a wrong host count would make Eyvan reject a
# correctly-provisioned slice, which is worse than not checking.
#
# CPU and RAM are mandatory because both participate in admission. Values below
# are per TPU VM, not totals across a multi-host slice. Google labels the RAM
# column "GB" in these TPU VM tables; Eyvan retains Google's published machine
# shape number in its historical `memory_gib` admission unit, consistently with
# the other GCP machine profiles in this repository. Every entry records the
# exact provider page/version reviewed so future edits do not become guesses.

catalog_version: 2
revision: "2026-08-04.2"

shapes:
  - accelerator_type: v5p-8
    kind: tpu
    generation: v5p
    chips: 4
    quota_units: 8
    hosts: 1
    chips_per_host: 4
    host_cpu: 208
    host_memory_gib: 448
    capacity_backend: gcp-compute
    source_url: https://cloud.google.com/tpu/docs/v5p
    source_version: "Last updated 2026-08-04 UTC"
    machine_type: ct5p-hightpu-4t
    tpu_type: ct5p
    image_family: ubuntu-accel-2204-amd64-tpu-v5e-v5p-v6e
    image_project: ubuntu-os-accelerator-images
    # Compiled as an integrated Compute Engine TPU VM, so it is deliberately
    # excluded from queued-resource autoscaling.
    multislice_capable: false

  - accelerator_type: v5p-16
    kind: tpu
    generation: v5p
    chips: 8
    quota_units: 16
    hosts: 2
    chips_per_host: 4
    host_cpu: 208
    host_memory_gib: 448
    capacity_backend: gcp-tpu
    multislice_capable: true
    source_url: https://cloud.google.com/tpu/docs/v5p
    source_version: "Last updated 2026-08-04 UTC"

  - accelerator_type: v5p-32
    kind: tpu
    generation: v5p
    chips: 16
    quota_units: 32
    hosts: 4
    chips_per_host: 4
    host_cpu: 208
    host_memory_gib: 448
    capacity_backend: gcp-tpu
    multislice_capable: true
    source_url: https://cloud.google.com/tpu/docs/v5p
    source_version: "Last updated 2026-08-04 UTC"

  - accelerator_type: v6e-8
    kind: tpu
    generation: v6e
    chips: 8
    quota_units: 8
    # v6e-8 is the documented full-host, eight-chip inference VM.
    host_cpu: 360
    host_memory_gib: 1440
    capacity_backend: gcp-tpu
    multislice_capable: true
    source_url: https://cloud.google.com/tpu/docs/v6e
    source_version: "Last updated 2026-08-04 UTC"

  - accelerator_type: v6e-16
    kind: tpu
    generation: v6e
    chips: 16
    quota_units: 16
    # hosts/chips_per_host deliberately absent: Google's table distinguishes
    # physical hosts from VMs, while Eyvan checks provider endpoint count. No
    # repository hardware receipt establishes that endpoint count for v6e-16,
    # so inventing it would make Eyvan refuse a correctly provisioned slice.
    # v6e-16 is composed of documented four-chip VMs; these are per-VM
    # resources, not a physical-host or whole-slice total.
    host_cpu: 180
    host_memory_gib: 720
    capacity_backend: gcp-tpu
    multislice_capable: true
    source_url: https://cloud.google.com/tpu/docs/v6e
    source_version: "Last updated 2026-08-04 UTC"
