{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: eyvan-schema-migration
  namespace: {{ include "eyvan.namespace" . }}
  annotations:
    # The ordering nobody should have to arrange by hand. A control plane that
    # starts against a schema it does not recognize refuses to serve -- which is
    # the correct behaviour and a confusing first impression.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["eyvan-migrate"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: EYVAN_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: database-url
{{- end }}
