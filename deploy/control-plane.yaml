apiVersion: v1
kind: Namespace
metadata:
  name: eyvan-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: eyvan-platform
  namespace: eyvan-system
data:
  platform.yaml: |
    version: 1
    agents:
      default:
        endpoint: http://eyvan-cell-agent.eyvan-system.svc.cluster.local:8090
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eyvan-control-plane
  namespace: eyvan-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eyvan-control-plane
  namespace: eyvan-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: eyvan-control-plane
  template:
    metadata:
      labels:
        app: eyvan-control-plane
    spec:
      serviceAccountName: eyvan-control-plane
      containers:
        - name: eyvan
          image: eyvan:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: platform-config
              mountPath: /etc/eyvan/platform.yaml
              subPath: platform.yaml
              readOnly: true
          env:
            - name: EYVAN_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: eyvan-secrets
                  key: database-url
            - name: EYVAN_REPOSITORY_BACKEND
              value: postgres
            - name: EYVAN_AUTO_CREATE_SCHEMA
              value: "false"
            - name: EYVAN_CONTROLLER_ENABLED
              value: "true"
            - name: EYVAN_OIDC_ISSUER
              valueFrom:
                secretKeyRef:
                  name: eyvan-secrets
                  key: oidc-issuer
            - name: EYVAN_OIDC_AUDIENCE
              value: eyvan
            - name: EYVAN_DEV_AUTH_ENABLED
              value: "false"
            - name: EYVAN_PUBLIC_URL
              valueFrom:
                secretKeyRef:
                  name: eyvan-secrets
                  key: public-url
            - name: EYVAN_ARTIFACT_STORE_URI
              valueFrom:
                secretKeyRef:
                  name: eyvan-secrets
                  key: artifact-store-uri
            - name: EYVAN_ARTIFACT_TOKEN_KEY
              valueFrom:
                secretKeyRef:
                  name: eyvan-secrets
                  key: artifact-token-key
            - name: EYVAN_TRUSTED_CALLABLE_PROJECTS
              valueFrom:
                secretKeyRef:
                  name: eyvan-secrets
                  key: trusted-callable-projects
            - name: EYVAN_AGENT_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: eyvan-secrets
                  key: agent-shared-secret
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
      volumes:
        - name: platform-config
          configMap:
            name: eyvan-platform
---
apiVersion: v1
kind: Service
metadata:
  name: eyvan-control-plane
  namespace: eyvan-system
spec:
  selector:
    app: eyvan-control-plane
  ports:
    - name: http
      port: 80
      targetPort: http
