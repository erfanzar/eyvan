[build-system]
requires = ["uv_build>=0.7.19,<0.8.0"]
build-backend = "uv_build"

[project]
name = "eyvan"
version = "0.1.0"
description = "A policy-aware global fleet control plane with native GCP CPU, GPU, and TPU capacity"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Erfan Zare Chavoshi", email = "Erfanzare810@gmail.com" }]
dependencies = [
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "click>=8.1.0",
    "cloudpickle>=3.1.0",
    "fastapi>=0.115.2",
    "httpx>=0.27.0",
    "opentelemetry-api>=1.28.0",
    "prometheus-client>=0.21.0",
    "pydantic>=2.11.0",
    "pyjwt[crypto]>=2.9.0",
    "pyyaml>=6.0",
    "rich>=13.9",
    "sqlalchemy[asyncio]>=2.0.36",
    "typing-extensions>=4.12.0",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
eyvan = "eyvan.sdk.cli:main"
eyvan-server = "eyvan.server.api.app:main"
eyvan-agent = "eyvan.worker.agent.cli:main"
eyvan-native-worker = "eyvan.worker.runtime.native_worker:main"
eyvan-migrate = "eyvan.server.persistence.migrate:main"

[project.optional-dependencies]
# aiosqlite gives the SQLAlchemy repository a real database to run against.
# Without it that backend -- the one production uses -- had no direct test at
# all, and a retention prune that could never make forward progress on it
# looked green because only the in-memory store was exercised.
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "aiosqlite>=0.20.0"]
oci = ["google-cloud-storage>=2.18.0"]
ray = ["ray[default]>=2.54.0"]

[tool.uv.build-backend]
module-name = "eyvan"
module-root = "."

[tool.ruff]
line-length = 121
target-version = "py310"

[tool.ruff.lint]
select = ["A", "B", "E", "F", "I", "NPY", "RUF", "UP", "W"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["eyvan"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
