# Every value here has a default that is either safe or absent. Nothing defaults
# to a credential, and nothing defaults to a permissive setting -- an operator
# who installs this chart with no values gets a control plane that refuses to
# serve rather than one that serves insecurely.

nameOverride: ""
namespace:
  create: true
  name: eyvan-system

image:
  repository: eyvan
  tag: latest
  pullPolicy: IfNotPresent

controlPlane:
  replicas: 2
  # Refused on a non-loopback bind, so this is the production value and the
  # chart does not offer the alternative.
  repositoryBackend: postgres
  autoCreateSchema: false
  publicUrl: ""
  # Empty means every submitter is refused a pickled callable, which executes
  # arbitrary code on your accelerators. That is the correct default.
  trustedCallableProjects: ""
  artifactStoreUri: ""
  oidc:
    issuer: ""
    audience: eyvan
    # The browser's public OAuth client. Served at runtime by the control plane
    # so one image can front more than one identity provider.
    dashboardClientId: ""
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 2Gi

cellAgent:
  enabled: true
  replicas: 1
  fleetStateUri: ""
  nativeWorkerPackage: ""
  nativeWorkerWheelhouse: ""
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 1Gi

migration:
  # A pre-install and pre-upgrade hook. Without it an operator has to order the
  # migration Job against the rollout by hand, and getting that wrong starts a
  # control plane against a schema it refuses.
  enabled: true
  backoffLimit: 1

# The name of a Secret you create separately. Nothing in this chart generates
# credentials: a chart that mints an artifact signing key would mint a different
# one on every upgrade, and every capability token already issued would stop
# verifying.
existingSecret: eyvan-secrets

networkPolicy:
  enabled: true
  # Reaching the API requires this label. More friction than allowing the
  # namespace, and the friction is the point: an unlabelled workload reaching
  # the control plane by accident is how a cluster-wide compromise becomes a
  # fleet-wide one.
  apiClientLabel: eyvan.dev/api-client
  metricsScraperLabel: eyvan.dev/metrics-scraper

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceMonitor:
  # Off by default: it needs the Prometheus Operator's CRDs, and a chart that
  # installs an object whose kind does not exist fails the whole release.
  enabled: false
  interval: 30s
