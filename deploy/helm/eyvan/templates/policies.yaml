{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: eyvan-control-plane
  namespace: {{ include "eyvan.namespace" . }}
spec:
  # The control plane is what releases capacity. While it is down every cell in
  # the fleet keeps billing and nothing reclaims them, so a drain must never
  # take the last replica.
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app: eyvan-control-plane
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: eyvan-control-plane
  namespace: {{ include "eyvan.namespace" . }}
spec:
  podSelector:
    matchLabels:
      app: eyvan-control-plane
  policyTypes: [Ingress]
  ingress:
    # Not a blanket allow. `/metrics` exports every tenant's spend behind a
    # scrape token an operator may not have configured, and this is the layer
    # that holds when they have not.
    - from:
        - podSelector:
            matchLabels:
              {{ .Values.networkPolicy.apiClientLabel }}: "true"
        - namespaceSelector:
            matchLabels:
              {{ .Values.networkPolicy.apiClientLabel }}: "true"
      ports:
        - protocol: TCP
          port: 8080
    # Separate, so scraping does not confer API access and API access does not
    # confer scraping.
    - from:
        - podSelector:
            matchLabels:
              {{ .Values.networkPolicy.metricsScraperLabel }}: "true"
        - namespaceSelector:
            matchLabels:
              {{ .Values.networkPolicy.metricsScraperLabel }}: "true"
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
{{- if .Values.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: eyvan-control-plane
  namespace: {{ include "eyvan.namespace" . }}
  labels:
    {{- include "eyvan.controlPlaneLabels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: eyvan-control-plane
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
