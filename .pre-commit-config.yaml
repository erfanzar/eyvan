repos:
  - repo: local
    hooks:
      - id: eyvan-license-headers
        name: AGPL-3.0 header on Eyvan sources
        description: Every Eyvan source file carries the AGPL-3.0 header
        entry: python scripts/license_headers.py
        language: system
        files: \.(py|ts|tsx)$
        exclude: node_modules|dist
        stages: [pre-commit]
